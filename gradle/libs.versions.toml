[versions]
# Build tooling
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
hilt = "2.52"

# AndroidX core / lifecycle / activity
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"

# Compose
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
hiltNavigationCompose = "1.2.0"

# Persistence
room = "2.6.1"
sqlcipher = "4.6.1"
sqliteKtx = "2.4.0"
datastore = "1.1.1"

# Background work
workManager = "2.9.1"

# Security
biometric = "1.1.0"

# Concurrency
coroutines = "1.9.0"

# UI / effects (on-device GPU + local image display — NO networking artifacts).
# Versions PINNED to the Compose 1.7.x line to match compose-bom 2024.10.01 (Compose 1.7.5) /
# AGP 8.7.3 / compileSdk 34. Newer releases pull JetBrains-Compose 1.8–1.10 → androidx.activity
# 1.12 → demand compileSdk 36 / AGP 8.9 (verified via each artifact's published metadata).
haze = "1.2.2"
composeShimmer = "1.3.2"
coil = "3.0.4"
telephoto = "0.14.0"

# Xposed / LSPosed (compileOnly — provided by the framework at runtime, NEVER bundled in the
# APK; classes live in de.robv.android.xposed.* supplied by LSPosed). Keeps no-INTERNET intact.
xposed = "82"

# Testing
junit = "4.13.2"
truth = "1.4.4"
coroutinesTest = "1.9.0"

[libraries]
# AndroidX core + lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (BOM-managed)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# UI / effects (on-device GPU rendering + local image display — no network deps).
# Coil3 CORE ONLY: never add coil-network-okhttp/-ktor. Telephoto base module, not the -image-coil bundle.
# haze-materials intentionally OMITTED: its preset pack drags org.jetbrains.compose.material3 (newer
# Compose) → compileSdk 36. We build a HazeStyle from the LiquidGlass tokens instead.
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "composeShimmer" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
telephoto-zoomable = { group = "me.saket.telephoto", name = "zoomable-android", version.ref = "telephoto" }

# Xposed API (compileOnly only — from the api.xposed.info repo; provided by LSPosed at runtime)
xposed-api = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# SQLCipher + sqlite
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
