name: Build & Release APK

# Builds the installable debug APK and publishes it as a GitHub Release asset.
# Trigger: push a tag like `v1.0` (cuts a release), or run manually from the Actions
# tab (workflow_dispatch — builds + uploads the APK as a run artifact, no release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # Debug APK is signed with the universal Android debug key, so it installs on any
      # device with no extra signing setup — the right artifact for direct download.
      - name: Stage APK with a friendly name
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/QuietPing-${TAG}-debug.apk"

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietPing-debug-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## QuietPing ${{ github.ref_name }}

            Fully on-device Android alert filter — no `INTERNET` permission, nothing leaves the phone.

            **Download:** grab the `QuietPing-*-debug.apk` below and sideload it (Android 8.0+).
            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for
            enabling notification access and other permissions on first launch.

            > This is a **debug** build (signed with the standard Android debug key) so it installs
            > with zero setup. For a production-signed build, sign `assembleRelease` with your own keystore.
